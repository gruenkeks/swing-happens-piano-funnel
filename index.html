<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swing Happens Piano Challenge</title>
    <meta
      name="description"
      content="Pianist, you're one step away from joining the Swing Happens Piano Challenge. Five days. One task. Get it done."
    />
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0b1728;
        --navy-2: #12233a;
        --cream: #f3ead8;
        --cream-soft: rgba(243, 234, 216, 0.68);
        --gold: #d4a017;
        --gold-deep: #b8870d;
        --burgundy: #7a2d45;
        --teal: #2f6f6c;
        --ink: #0b1728;
        --line: rgba(243, 234, 216, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--navy);
        color: var(--cream);
        font-family: Outfit, sans-serif;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      .progress {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        width: 100%;
        height: 3px;
        background: rgba(243, 234, 216, 0.08);
      }

      .progress > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--burgundy), var(--gold));
        transform-origin: left;
        transition: width 420ms ease;
      }

      .topbar {
        position: fixed;
        top: 14px;
        left: 22px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .topbar img {
        width: 52px;
        height: 52px;
        border-radius: 50%;
      }

      #stage {
        min-height: 100%;
      }

      #app {
        min-height: 100vh;
      }

      .screen {
        min-height: 100vh;
        animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(280px, 48vw) 1fr;
        min-height: 100vh;
      }

      .hero-photo {
        position: relative;
        overflow: hidden;
        background: #0a1018;
      }

      .hero-photo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 42% 28%;
      }

      .hero-photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 58%, var(--navy) 100%);
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 88px 8vw 88px 48px;
      }

      .ribbon {
        display: inline-flex;
        align-self: flex-start;
        margin: 0 0 22px;
        padding: 12px 18px;
        background: var(--burgundy);
        color: #fff;
        font-size: clamp(1.02rem, 1.6vw, 1.22rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .hero h1 {
        margin: 0 0 18px;
        max-width: 11ch;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(3rem, 6vw, 5.4rem);
        font-weight: 500;
        line-height: 0.94;
        letter-spacing: -0.045em;
      }

      .hero h1 em {
        color: var(--gold);
        font-style: italic;
        font-weight: 500;
      }

      .lede {
        max-width: 38ch;
        margin: 0 0 28px;
        color: var(--cream-soft);
        font-size: 1.12rem;
        line-height: 1.65;
      }

      .lede strong {
        color: var(--gold);
        font-weight: 600;
      }

      .question {
        display: flex;
        align-items: center;
        min-height: 100vh;
        padding: 96px 8vw 120px;
      }

      .question-inner {
        width: min(720px, 100%);
      }

      .qnum {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--gold);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .qnum svg {
        width: 14px;
        height: 14px;
      }

      .question h2 {
        margin: 0 0 12px;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(1.7rem, 3.4vw, 2.55rem);
        font-weight: 500;
        line-height: 1.18;
        letter-spacing: -0.03em;
      }

      .question h2 em {
        color: var(--gold);
        font-style: italic;
      }

      .hint {
        margin: 0 0 28px;
        color: var(--cream-soft);
        font-size: 1.02rem;
        line-height: 1.6;
      }

      .options {
        display: grid;
        gap: 10px;
        max-width: 640px;
      }

      .option {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(243, 234, 216, 0.03);
        text-align: left;
        transition: 180ms ease;
      }

      .option:hover,
      .option:focus-visible {
        border-color: rgba(212, 160, 23, 0.7);
        background: rgba(212, 160, 23, 0.08);
        outline: none;
      }

      .option.selected {
        border-color: var(--gold);
        background: rgba(212, 160, 23, 0.16);
      }

      .key {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 28px;
        place-items: center;
        border: 1px solid rgba(243, 234, 216, 0.28);
        border-radius: 4px;
        color: var(--cream);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .option.selected .key {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--ink);
      }

      .nested {
        margin-top: 28px;
        padding-top: 8px;
      }

      .beats {
        display: grid;
        gap: 14px;
        margin: 8px 0 28px;
        color: var(--cream-soft);
        line-height: 1.55;
      }

      .beats div {
        display: flex;
        gap: 12px;
      }

      .beats b {
        color: var(--gold);
        font-weight: 700;
      }

      .consent {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 0 0 8px;
        color: var(--cream);
        line-height: 1.45;
      }

      .consent input {
        width: 18px;
        height: 18px;
        margin-top: 3px;
        accent-color: var(--gold);
      }

      .fields {
        display: grid;
        gap: 28px;
        max-width: 560px;
        margin: 12px 0 10px;
      }

      .fields label {
        display: grid;
        gap: 8px;
        color: var(--cream-soft);
        font-size: 0.92rem;
      }

      .fields input {
        width: 100%;
        padding: 8px 0 12px;
        border: 0;
        border-bottom: 1px solid rgba(243, 234, 216, 0.28);
        background: transparent;
        color: var(--cream);
        font-size: 1.2rem;
        outline: none;
      }

      .fields input:focus {
        border-bottom-color: var(--gold);
      }

      .error {
        min-height: 1.2em;
        margin: 8px 0 0;
        color: #e7a0b1;
        font-size: 0.9rem;
      }

      .ok {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }

      .cta {
        min-height: 48px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--gold);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .cta:hover:not(:disabled) {
        background: #e0b12a;
      }

      .cta:disabled {
        cursor: not-allowed;
        opacity: 0.35;
      }

      .enter {
        color: var(--cream-soft);
        font-size: 0.82rem;
      }

      .ok kbd {
        margin: 0 2px;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.72rem;
      }

      .dock {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 20;
        display: flex;
        gap: 8px;
      }

      .dock button {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(11, 23, 40, 0.7);
        color: var(--cream);
      }

      .dock button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .legal {
        position: fixed;
        left: 22px;
        bottom: 18px;
        z-index: 20;
        color: rgba(243, 234, 216, 0.38);
        font-size: 0.72rem;
      }

      .legal a {
        color: inherit;
      }

      @media (max-width: 860px) {
        .hero {
          position: relative;
          display: grid;
          grid-template-columns: 1fr;
          height: 100dvh;
          min-height: 100dvh;
          overflow: hidden;
        }

        .hero-photo {
          position: absolute;
          top: 0;
          right: 0;
          left: 0;
          height: 58%;
          background: #0a1018;
        }

        .hero-photo img {
          object-fit: cover;
          object-position: 38% 18%;
        }

        .hero-photo::after {
          background: linear-gradient(
            180deg,
            transparent 32%,
            rgba(11, 23, 40, 0.42) 58%,
            var(--navy) 88%
          );
        }

        .hero-copy {
          position: relative;
          z-index: 1;
          min-height: 100dvh;
          justify-content: flex-end;
          padding: 0 22px 78px;
        }

        .hero .ribbon {
          margin-bottom: 12px;
          max-width: 24rem;
          white-space: normal;
          font-size: 1.02rem;
          letter-spacing: 0.05em;
        }

        .hero .lede {
          margin-bottom: 16px;
          font-size: 1rem;
        }

        .hero .ok {
          margin-top: 0;
        }

        .hero h1 {
          max-width: none;
          font-size: clamp(2.1rem, 9.5vw, 2.7rem);
        }

        .enter {
          display: none;
        }

        .question {
          padding: 92px 22px 140px;
        }

        .legal {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .screen {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <header class="topbar">
      <img src="assets/logo.png" alt="Swing Happens" />
    </header>
    <div id="stage">
      <section id="app" aria-live="polite"></section>
    </div>
    <nav class="dock" aria-label="Form navigation">
      <button type="button" data-nav="back" aria-label="Back">↑</button>
      <button type="button" data-nav="next" aria-label="Next">↓</button>
    </nav>
    <p class="legal"><a href="privacy.html">Privacy</a></p>

    <script src="js/config.js"></script>
    <script>
      const app = document.getElementById("app");
      const bar = document.getElementById("bar");
      const params = new URLSearchParams(window.location.search);
      const keys = "ABCDEFGH".split("");

      const state = {
        index: 0,
        answers: {},
        contact: { firstName: "", lastName: "", phone: "", email: "" },
        tracking: {
          campaign_name: params.get("campaign_name") || params.get("utm_campaign") || "",
          adset_name: params.get("adset_name") || params.get("utm_content") || "",
          ad_name: params.get("ad_name") || params.get("utm_term") || "",
          traffic_source: params.get("traffic_source") || params.get("utm_source") || "",
        },
        error: "",
        lock: false,
      };

      const steps = [
        { id: "entry", type: "entry" },
        {
          id: "expert",
          type: "choice",
          question: "Would you like a 30-minute <em>Time-Feel Call</em> before you start?",
          hint: "Most pianists struggle because they can't hear their own timing errors.",
          key: "expert",
          options: [
            ["yes", "Yes, I want expert feedback", 5],
            ["no", "No, I'll do it on my own for now", 0],
          ],
        },
        {
          id: "urgency",
          type: "choice",
          question: "How essential is it to <em>fix</em> your Time-Feel right now?",
          hint: "Notes are easy. Timing is the key that makes or breaks the music.",
          key: "urgency",
          options: [
            ["one", "Not a priority right now", 0],
            ["two", "I can live with it", 0],
            ["three", "Important, but I'm not rushing", 1],
            ["four", "It's a major barrier for me", 2],
            ["five", "Essential. I need to lock this in now", 5],
          ],
        },
        {
          id: "background",
          type: "background",
          question: "Which category describes you best?",
          hint: "This helps tailor the challenge to how you work.",
          options: [
            ["professional", "Music professional / student", 2],
            ["hobby", "Passion project — music is my hobby", 0],
            ["retirement", "Enjoying retirement", 5],
            ["opportunities", "Seeking opportunities", 0],
          ],
          detailQuestion: "What is your professional background?",
          detailHint: "It tells us how you process something as subtle as Time Feel.",
          detailOptions: [
            ["tech", "IT / software / tech", 5],
            ["management", "Management / consulting", 4],
            ["public", "Healthcare / law / public service", 5],
            ["creative", "Creative / crafts / other", 2],
          ],
        },
        {
          id: "setup",
          type: "choice",
          question: "What's your main piano setup?",
          key: "setup",
          options: [
            ["acoustic", "Acoustic piano", 0],
            ["digital", "Digital piano", 0],
            ["keyboard", "Keyboard / stage piano", 0],
            ["multiple", "I use more than one setup", 0],
          ],
        },
        {
          id: "level",
          type: "choice",
          question: "How would you describe your current piano level?",
          hint: "No judgment — just so we can tailor the work.",
          key: "level",
          options: [
            ["beginner", "Beginner", 2],
            ["intermediate", "Intermediate", 5],
            ["advanced", "Advanced", 4],
          ],
        },
        {
          id: "problem",
          type: "choice",
          question: "What describes your situation best?",
          hint: "Most pianists are stuck at this exact point.",
          key: "problem",
          options: [
            ["apply", "I know a lot, but I can't apply it when I play", 3],
            ["swing", "My phrasing and lines don't really swing", 3],
            ["time", "I lose the time when I improvise", 3],
            ["groove", "I can play the notes, but my groove doesn't feel stable", 3],
          ],
        },
        {
          id: "commitment",
          type: "choice",
          question: "What sounds most like you?",
          key: "commitment",
          options: [
            ["improvement", "I want real improvement, not just more exercises", 5],
            ["curious", "I'm curious, but not super committed", 3],
            ["scroll", "I mostly watch and scroll", 0],
          ],
        },
        { id: "how", type: "how" },
        { id: "contact", type: "contact" },
      ];

      function currentStep() {
        return steps[state.index];
      }

      function score() {
        return Object.values(state.answers).reduce((total, answer) => total + (answer?.points || 0), 0);
      }

      function routing() {
        return score() >= 24 ? "vip" : "standard";
      }

      function qIndex() {
        return Math.max(state.index, 1);
      }

      function optionList(options, answerKey) {
        return `<div class="options">${options
          .map(([value, label], index) => {
            const selected = state.answers[answerKey]?.value === value ? "selected" : "";
            return `<button class="option ${selected}" type="button" data-answer-key="${answerKey}" data-value="${value}">
              <span class="key">${keys[index]}</span>
              <span>${label}</span>
            </button>`;
          })
          .join("")}</div>`;
      }

      function okRow(label, disabled, action = "next") {
        return `<div class="ok">
          <button class="cta" type="button" data-action="${action}" ${disabled ? "disabled" : ""}>${label}</button>
          <span class="enter">press <kbd>Enter ↵</kbd></span>
        </div>`;
      }

      function questionChrome(title, hint = "") {
        return `<p class="qnum">${qIndex()} <svg viewBox="0 0 14 14" aria-hidden="true"><path fill="currentColor" d="M1 7h10M8 3l4 4-4 4"/></svg></p>
          <h2>${title}</h2>
          ${hint ? `<p class="hint">${hint}</p>` : ""}`;
      }

      function entryMarkup() {
        return `
          <div class="screen hero">
            <div class="hero-photo">
              <img src="assets/hero-piano.jpg?v=10" alt="Pianist at a grand piano" />
            </div>
            <div class="hero-copy">
              <p class="ribbon">5-day Timefeel Challenge for piano players</p>
              <h1>Play with more flow. <em>Feel the groove.</em></h1>
              <p class="lede">
                You're playing the right notes — yet it doesn't lock in.
                Time is trained, not discussed. Takes 30 seconds.
              </p>
              <div class="ok">
                <button class="cta" type="button" data-action="next">Join free now</button>
                <span class="enter">press <kbd>Enter ↵</kbd></span>
              </div>
            </div>
          </div>
        `;
      }

      function choiceMarkup(step) {
        return `
          <div class="screen question">
            <div class="question-inner">
              ${questionChrome(step.question, step.hint)}
              ${optionList(step.options, step.key)}
              ${okRow("OK", !state.answers[step.key])}
            </div>
          </div>
        `;
      }

      function backgroundMarkup(step) {
        const hasHobby = state.answers.background?.value === "hobby";
        const ready = state.answers.background && (!hasHobby || state.answers.backgroundDetail);
        return `
          <div class="screen question">
            <div class="question-inner">
              ${questionChrome(step.question, step.hint)}
              ${optionList(step.options, "background")}
              <div class="nested" ${hasHobby ? "" : "hidden"}>
                <h2>${step.detailQuestion}</h2>
                <p class="hint">${step.detailHint}</p>
                ${optionList(step.detailOptions, "backgroundDetail")}
              </div>
              ${okRow("OK", !ready)}
            </div>
          </div>
        `;
      }

      function howMarkup() {
        return `
          <div class="screen question">
            <div class="question-inner">
              ${questionChrome("This is not a passive piano challenge.")}
              <div class="beats">
                <div><b>01</b> 5 days, starting from the first video you send</div>
                <div><b>02</b> One short task per day, by email</div>
                <div><b>03</b> You send a short video of you playing piano</div>
                <div><b>04</b> It gets reviewed. Then you get the next step</div>
              </div>
              <p class="hint">If you stop responding, you're out. This is about getting it done.</p>
              <label class="consent">
                <input id="participation" type="checkbox" ${state.answers.participation ? "checked" : ""} />
                <span>I understand this requires daily participation</span>
              </label>
              ${okRow("I'm in", !state.answers.participation)}
            </div>
          </div>
        `;
      }

      function contactMarkup() {
        const c = state.contact;
        return `
          <div class="screen question">
            <div class="question-inner">
              ${questionChrome("Where should we send your access?")}
              <div class="fields">
                <label>First name<input id="firstName" type="text" autocomplete="given-name" autofocus value="${escapeAttr(c.firstName)}" /></label>
                <label>Last name<input id="lastName" type="text" autocomplete="family-name" value="${escapeAttr(c.lastName)}" /></label>
                <label>Phone / WhatsApp<input id="phone" type="tel" autocomplete="tel" value="${escapeAttr(c.phone)}" /></label>
                <label>Email<input id="email" type="email" autocomplete="email" value="${escapeAttr(c.email)}" /></label>
              </div>
              <p class="error">${state.error || ""}</p>
              ${okRow("Get access", false, "submit")}
            </div>
          </div>
        `;
      }

      function escapeAttr(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("<", "&lt;");
      }

      function render() {
        const step = currentStep();
        bar.style.width = `${(state.index / (steps.length - 1)) * 100}%`;
        if (step.type === "entry") app.innerHTML = entryMarkup();
        else if (step.type === "choice") app.innerHTML = choiceMarkup(step);
        else if (step.type === "background") app.innerHTML = backgroundMarkup(step);
        else if (step.type === "how") app.innerHTML = howMarkup();
        else app.innerHTML = contactMarkup();
        bindEvents();
      }

      function canAdvance() {
        const step = currentStep();
        if (step.type === "entry") return true;
        if (step.type === "choice") return Boolean(state.answers[step.key]);
        if (step.type === "background") {
          const hobby = state.answers.background?.value === "hobby";
          return Boolean(state.answers.background && (!hobby || state.answers.backgroundDetail));
        }
        if (step.type === "how") return Boolean(state.answers.participation);
        return true;
      }

      function go(delta) {
        if (state.lock) return;
        if (delta > 0 && !canAdvance()) return;
        const next = Math.min(Math.max(state.index + delta, 0), steps.length - 1);
        if (next === state.index) return;
        state.lock = true;
        state.index = next;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        setTimeout(() => {
          state.lock = false;
        }, 280);
      }

      function choose(answerKey, value) {
        const step = currentStep();
        const source = answerKey === "backgroundDetail" ? step.detailOptions : step.options;
        const selected = source.find((item) => item[0] === value);
        if (!selected) return;
        state.answers[answerKey] = { value: selected[0], points: selected[2] };
        if (answerKey === "background" && selected[0] !== "hobby") delete state.answers.backgroundDetail;
        render();
        const ready =
          step.type === "choice" ||
          (step.type === "background" &&
            state.answers.background &&
            (state.answers.background.value !== "hobby" || state.answers.backgroundDetail));
        if (ready) setTimeout(() => go(1), 260);
      }

      function bindEvents() {
        app.querySelectorAll("[data-answer-key]").forEach((button) => {
          button.addEventListener("click", () => choose(button.dataset.answerKey, button.dataset.value));
        });

        const participation = document.getElementById("participation");
        if (participation) {
          participation.addEventListener("change", () => {
            state.answers.participation = participation.checked;
            render();
          });
        }

        ["firstName", "lastName", "phone", "email"].forEach((id) => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener("input", () => {
            state.contact[id] = input.value;
            state.error = "";
          });
        });

        app.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", async () => {
            if (button.dataset.action === "submit") {
              await submitLead();
              return;
            }
            go(1);
          });
        });
      }

      document.querySelectorAll("[data-nav]").forEach((button) => {
        button.addEventListener("click", () => go(button.dataset.nav === "back" ? -1 : 1));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          if (currentStep().type === "contact") {
            event.preventDefault();
            submitLead();
            return;
          }
          event.preventDefault();
          go(1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          go(-1);
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          go(1);
        } else if (/^[a-zA-Z]$/.test(event.key) && !event.metaKey && !event.ctrlKey) {
          const target = document.activeElement;
          if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
          const step = currentStep();
          const list =
            step.type === "background" && state.answers.background?.value === "hobby" && !state.answers.backgroundDetail
              ? step.detailOptions
              : step.options;
          if (!list) return;
          const index = keys.indexOf(event.key.toUpperCase());
          if (index >= 0 && list[index]) {
            const keyName = step.type === "background" && list === step.detailOptions ? "backgroundDetail" : step.key || "background";
            choose(keyName, list[index][0]);
          }
        }
      });

      function payload() {
        return {
          kunde: { name: "Swing Happens Piano", id: "swing-happens-piano" },
          typ: "challenge",
          contact: state.contact,
          answers: state.answers,
          score: score(),
          routing: routing(),
          tracking: state.tracking,
          submittedAt: new Date().toISOString(),
        };
      }

      async function submitLead() {
        const c = state.contact;
        if (!c.firstName.trim() || !c.lastName.trim() || !c.phone.trim() || !c.email.trim()) {
          state.error = "Please fill in name, phone, and email.";
          render();
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) {
          state.error = "Please enter a valid email.";
          render();
          return;
        }
        const data = payload();
        sessionStorage.setItem("swing-piano-lead", JSON.stringify(data));
        const webhook = window.SWING_PIANO?.webhookUrl;
        if (webhook) {
          try {
            await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
          } catch (err) {
            console.warn("webhook failed", err);
          }
        }
        window.location.href = "oto.html";
      }

      render();
    </script>
  </body>
</html>
