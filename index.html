<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swing Happens Piano Challenge</title>
    <meta
      name="description"
      content="Pianist, you're one step away from joining the Swing Happens Piano Challenge. Five days. One task. Get it done."
    />
    <link rel="icon" href="assets/swing-happens-logo.webp" />
    <style>
      :root {
        color-scheme: dark;
        --navy-950: #08111f;
        --navy-900: #0d1a2b;
        --ink: #f5f7fb;
        --muted: #a9b6c9;
        --gold: #e8b11a;
        --red: #ff4545;
        --green: #62d39b;
        --line: rgba(255, 255, 255, 0.13);
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(232, 177, 26, 0.15), transparent 34rem),
          radial-gradient(circle at 92% 12%, rgba(57, 113, 171, 0.2), transparent 30rem),
          var(--navy-950);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 46px 0 64px;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 50%;
      }

      .progress {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 18px;
      }

      .progress-item {
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
        color: #73849b;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .progress-item.active {
        border-color: rgba(232, 177, 26, 0.72);
        background: rgba(232, 177, 26, 0.11);
        color: #ffe9a0;
      }

      .progress-item.done {
        border-color: rgba(98, 211, 155, 0.38);
        color: #95e5bb;
      }

      .card {
        min-height: 610px;
        padding: clamp(26px, 6vw, 68px);
        border: 1px solid var(--line);
        border-radius: 26px;
        background:
          linear-gradient(145deg, rgba(30, 54, 84, 0.84), rgba(12, 25, 42, 0.95)),
          var(--navy-900);
        box-shadow: var(--shadow);
      }

      .entry-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--gold);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 790px;
        margin-bottom: 22px;
        font-size: clamp(2.15rem, 6vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      h1 em {
        color: var(--red);
        font-style: normal;
      }

      h2 {
        font-size: clamp(1.55rem, 3.5vw, 2.35rem);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .story {
        width: min(510px, 100%);
        margin: 0 auto 28px;
        color: #d4dce8;
        font-size: 1.05rem;
        line-height: 1.55;
      }

      .story span {
        display: block;
        margin: 3px 0;
      }

      .story .spacer {
        height: 11px;
      }

      .entry-copy {
        max-width: 540px;
        margin-bottom: 30px;
        color: var(--muted);
        font-size: 1.08rem;
      }

      .entry-copy strong {
        color: var(--ink);
      }

      .question-card {
        max-width: 720px;
        margin: 0 auto;
      }

      .question-label {
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .question-label em {
        color: #ffe9a0;
        font-style: normal;
      }

      .options {
        display: grid;
        gap: 11px;
        margin: 26px 0 30px;
      }

      .option {
        width: 100%;
        padding: 16px 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 13px;
        background: rgba(7, 17, 31, 0.36);
        color: var(--ink);
        text-align: left;
        transition: 160ms ease;
      }

      .option:hover {
        border-color: rgba(232, 177, 26, 0.68);
        background: rgba(232, 177, 26, 0.09);
      }

      .option.selected {
        border-color: var(--gold);
        background: rgba(232, 177, 26, 0.16);
      }

      .conditional {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      .conditional[hidden] {
        display: none;
      }

      .how-it-works {
        display: grid;
        gap: 12px;
        margin: 24px 0 30px;
        color: #d4dce8;
        line-height: 1.55;
      }

      .how-it-works strong {
        color: var(--red);
      }

      .consent {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 25px 0 30px;
        color: #d4dce8;
        line-height: 1.45;
      }

      .consent input {
        width: 20px;
        height: 20px;
        margin-top: 1px;
        accent-color: var(--gold);
      }

      .contact-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin: 26px 0 8px;
      }

      .contact-grid label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 0.83rem;
        font-weight: 700;
      }

      .contact-grid label:nth-child(3),
      .contact-grid label:nth-child(4) {
        grid-column: 1 / -1;
      }

      .contact-grid input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: rgba(7, 17, 31, 0.38);
        color: var(--ink);
      }

      .error {
        min-height: 1.3em;
        margin: 0 0 18px;
        color: #ff8d8d;
        font-size: 0.88rem;
      }

      .button-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 30px;
      }

      .primary,
      .secondary {
        min-height: 49px;
        padding: 13px 22px;
        border-radius: 11px;
        font-weight: 850;
      }

      .primary {
        border: 1px solid #ff5b5b;
        background: var(--red);
        color: white;
      }

      .primary:hover:not(:disabled) {
        background: #ff6262;
      }

      .primary:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .secondary {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
      }

      .footer-note {
        margin-top: 18px;
        color: #667890;
        font-size: 0.76rem;
        text-align: center;
      }

      .footer-note a {
        color: #8ea0b8;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 20px, 1080px);
          padding-top: 28px;
        }

        .contact-grid,
        .button-row {
          grid-template-columns: 1fr;
          flex-direction: column-reverse;
          align-items: stretch;
        }

        .contact-grid label:nth-child(3),
        .contact-grid label:nth-child(4),
        .button-row button {
          grid-column: auto;
          width: 100%;
        }

        .card {
          min-height: 0;
          padding: 28px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topline">
        <div class="brand">
          <img src="assets/swing-happens-logo.webp" alt="" />
          <span>Swing Happens Piano</span>
        </div>
      </div>
      <div id="progress" class="progress" aria-label="Form progress"></div>
      <section id="app" class="card" aria-live="polite"></section>
      <p class="footer-note">
        Swing Happens Piano Challenge ·
        <a href="privacy.html">Privacy</a>
      </p>
    </main>

    <script src="js/config.js"></script>
    <script>
      const app = document.getElementById("app");
      const progress = document.getElementById("progress");
      const params = new URLSearchParams(window.location.search);

      const state = {
        index: 0,
        answers: {},
        contact: {
          firstName: "",
          lastName: "",
          phone: "",
          email: "",
        },
        tracking: {
          campaign_name: params.get("campaign_name") || params.get("utm_campaign") || "",
          adset_name: params.get("adset_name") || params.get("utm_content") || "",
          ad_name: params.get("ad_name") || params.get("utm_term") || "",
          traffic_source: params.get("traffic_source") || params.get("utm_source") || "",
        },
        error: "",
      };

      const steps = [
        { id: "entry", stage: "Welcome", type: "entry" },
        {
          id: "expert",
          stage: "Welcome",
          type: "choice",
          eyebrow: "Speed up your results?",
          question:
            "Most pianists struggle because they can't hear their own timing errors.<br><br>Would you like a 30-minute <em>Time-Feel Call</em> with Frank to identify what's holding your groove back before we start?",
          key: "expert",
          options: [
            ["yes", "Yes, I want expert feedback!", 5],
            ["no", "No, I'll do it on my own for now.", 0],
          ],
        },
        {
          id: "urgency",
          stage: "YourProfile",
          type: "choice",
          eyebrow: "Your current priority",
          question:
            "How essential is it for you to <strong>fix</strong> your <em>Time-Feel</em> right now?<br><br>Notes are easy. Timing is the “key” that makes or breaks the music.",
          key: "urgency",
          options: [
            ["one", "1: Not a priority right now", 0],
            ["two", "2: I can live with it.", 0],
            ["three", "3: It's important, but I'm not rushing.", 1],
            ["four", "4: It's a major barrier for me.", 2],
            ["five", "5: Essential. I need to lock this in now.", 5],
          ],
        },
        {
          id: "background",
          stage: "YourProfile",
          type: "background",
          eyebrow: "A little context",
          question: "To tailor the challenge to your background...<br><br>Which category describes you best?",
          options: [
            ["professional", "Music Professional / Student", 2],
            ["hobby", "Passion Project — Music is my hobby", 0],
            ["retirement", "Enjoying Retirement", 5],
            ["opportunities", "Seeking opportunities", 0],
          ],
          detailOptions: [
            ["tech", "IT / Software / Tech", 5],
            ["management", "Management / Consulting", 4],
            ["public", "Healthcare / Law / Public Service", 5],
            ["creative", "Creative / Crafts / Other", 2],
          ],
        },
        {
          id: "setup",
          stage: "YourProfile",
          type: "choice",
          eyebrow: "Your instrument",
          question: "What's your main piano setup?",
          key: "setup",
          options: [
            ["acoustic", "Acoustic piano", 0],
            ["digital", "Digital piano", 0],
            ["keyboard", "Keyboard / stage piano", 0],
            ["multiple", "I use more than one setup", 0],
          ],
        },
        {
          id: "level",
          stage: "YourProfile",
          type: "choice",
          eyebrow: "No judgment",
          question: "How would you describe your current piano level?",
          key: "level",
          options: [
            ["beginner", "Beginner", 2],
            ["intermediate", "Intermediate", 5],
            ["advanced", "Advanced", 4],
          ],
        },
        {
          id: "problem",
          stage: "YourProfile",
          type: "choice",
          eyebrow: "The sticking point",
          question: "Most pianists are stuck at this exact point:<br><br>What describes your situation best?",
          key: "problem",
          options: [
            ["apply", "I know a lot, but I can't apply it when I play", 3],
            ["swing", "My phrasing and lines don't really swing", 3],
            ["time", "I lose the time when I improvise", 3],
            ["groove", "I can play the notes, but my groove doesn't feel stable", 3],
          ],
        },
        {
          id: "commitment",
          stage: "YourProfile",
          type: "choice",
          eyebrow: "Your commitment",
          question: "What sounds most like you?",
          key: "commitment",
          options: [
            ["improvement", "I want real improvement, not just more exercises", 5],
            ["curious", "I'm curious, but not super committed", 3],
            ["scroll", "I mostly watch and scroll", 0],
          ],
        },
        { id: "how", stage: "GetAccess", type: "how" },
        { id: "contact", stage: "GetAccess", type: "contact" },
      ];

      const stages = ["Welcome", "YourProfile", "GetAccess"];

      function currentStep() {
        return steps[state.index];
      }

      function score() {
        return Object.values(state.answers).reduce((total, answer) => total + (answer?.points || 0), 0);
      }

      function routing() {
        return score() >= 24 ? "vip" : "standard";
      }

      function stageIndex() {
        const index = stages.indexOf(currentStep().stage);
        return index === -1 ? stages.length - 1 : index;
      }

      function renderProgress() {
        const active = stageIndex();
        progress.innerHTML = stages
          .map((stage, index) => {
            const className = index < active ? "done" : index === active ? "active" : "";
            return `<div class="progress-item ${className}">${stage}</div>`;
          })
          .join("");
      }

      function optionButton(options, answerKey) {
        return `<div class="options">${options
          .map(([value, label]) => {
            const selected = state.answers[answerKey]?.value === value ? "selected" : "";
            return `<button class="option ${selected}" type="button" data-answer-key="${answerKey}" data-value="${value}">${label}</button>`;
          })
          .join("")}</div>`;
      }

      function choiceMarkup(step) {
        return `
          <div class="question-card">
            <p class="eyebrow">${step.eyebrow}</p>
            <h2>${step.question}</h2>
            ${optionButton(step.options.map(([value, label]) => [value, label]), step.key)}
            <div class="button-row">
              ${state.index > 0 ? '<button class="secondary" type="button" data-action="back">← Back</button>' : "<span></span>"}
              <button class="primary" type="button" data-action="next" ${state.answers[step.key] ? "" : "disabled"}>👉 Next</button>
            </div>
          </div>
        `;
      }

      function backgroundMarkup(step) {
        const hasHobby = state.answers.background?.value === "hobby";
        return `
          <div class="question-card">
            <p class="eyebrow">${step.eyebrow}</p>
            <h2>${step.question}</h2>
            ${optionButton(step.options.map(([value, label]) => [value, label]), "background")}
            <div class="conditional" ${hasHobby ? "" : "hidden"}>
              <p class="question-label">Great! What is your professional background?<br><br>This helps me understand how you process complex information like <em>Time Feel</em>.</p>
              ${optionButton(step.detailOptions.map(([value, label]) => [value, label]), "backgroundDetail")}
            </div>
            <div class="button-row">
              <button class="secondary" type="button" data-action="back">← Back</button>
              <button class="primary" type="button" data-action="next" ${state.answers.background && (!hasHobby || state.answers.backgroundDetail) ? "" : "disabled"}>👉 Next</button>
            </div>
          </div>
        `;
      }

      function entryMarkup() {
        return `
          <div class="entry-card">
            <p class="eyebrow">Pianist · Swing Happens</p>
            <h1>Pianist, You're one step away from joining the <em>Swing Happens Piano Challenge</em></h1>
            <div class="story">
              <span>You know the moment.</span>
              <span>Good band.</span>
              <span>Good energy.</span>
              <span>But something isn't locked.</span>
              <span class="spacer"></span>
              <span>You're playing the right notes — yet it doesn't lock in.</span>
              <span class="spacer"></span>
              <span>Serious pianists know — this isn't about learning more information.</span>
              <span>It's time.</span>
              <span class="spacer"></span>
              <span>And time is trained — not discussed.</span>
              <span class="spacer"></span>
              <span>This isn't about collecting more information.</span>
              <span>It's about getting it done.</span>
            </div>
            <p class="entry-copy"><strong>Takes 30 seconds.</strong> Let's go.</p>
            <div class="button-row">
              <span></span>
              <button class="primary" type="button" data-action="next">👉 Start</button>
            </div>
          </div>
        `;
      }

      function howMarkup() {
        return `
          <div class="question-card">
            <p class="eyebrow">How this works</p>
            <h2>This is not a passive Piano challenge.</h2>
            <div class="how-it-works">
              <div>• 5 days, starting from the first video you send</div>
              <div>• 1 short task per day via email</div>
              <div>• You send a short video of you playing piano</div>
              <div>• Frank reviews it → you get the next step</div>
              <div>Your challenge begins when you submit Day 1.</div>
              <div><strong>If you stop responding, you're out.</strong></div>
              <div>This is not about more information.</div>
              <div><strong>This is about getting it done.</strong></div>
            </div>
            <label class="consent">
              <input id="participation" type="checkbox" ${state.answers.participation ? "checked" : ""} />
              <span>I understand this requires daily participation</span>
            </label>
            <div class="button-row">
              <button class="secondary" type="button" data-action="back">← Back</button>
              <button class="primary" type="button" data-action="next" ${state.answers.participation ? "" : "disabled"}>👉 I'm in</button>
            </div>
          </div>
        `;
      }

      function contactMarkup() {
        const c = state.contact;
        return `
          <div class="question-card">
            <p class="eyebrow">Get access</p>
            <h2>Where should we send your challenge access?</h2>
            <div class="contact-grid">
              <label>First Name<input id="firstName" type="text" autocomplete="given-name" value="${escapeAttr(c.firstName)}" /></label>
              <label>Last Name<input id="lastName" type="text" autocomplete="family-name" value="${escapeAttr(c.lastName)}" /></label>
              <label>Phone number / WhatsApp<input id="phone" type="tel" autocomplete="tel" value="${escapeAttr(c.phone)}" /></label>
              <label>Where should we send your access?<input id="email" type="email" autocomplete="email" value="${escapeAttr(c.email)}" /></label>
            </div>
            <p class="error">${state.error || ""}</p>
            <input type="hidden" name="campaign_name" value="${escapeAttr(state.tracking.campaign_name)}" />
            <input type="hidden" name="adset_name" value="${escapeAttr(state.tracking.adset_name)}" />
            <input type="hidden" name="ad_name" value="${escapeAttr(state.tracking.ad_name)}" />
            <input type="hidden" name="traffic_source" value="${escapeAttr(state.tracking.traffic_source)}" />
            <div class="button-row">
              <button class="secondary" type="button" data-action="back">← Back</button>
              <button class="primary" type="button" data-action="submit">👉 Get access</button>
            </div>
          </div>
        `;
      }

      function escapeAttr(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("<", "&lt;");
      }

      function render() {
        const step = currentStep();
        renderProgress();
        if (step.type === "entry") app.innerHTML = entryMarkup();
        else if (step.type === "choice") app.innerHTML = choiceMarkup(step);
        else if (step.type === "background") app.innerHTML = backgroundMarkup(step);
        else if (step.type === "how") app.innerHTML = howMarkup();
        else app.innerHTML = contactMarkup();
        bindEvents();
      }

      function bindEvents() {
        app.querySelectorAll("[data-answer-key]").forEach((button) => {
          button.addEventListener("click", () => {
            const answerKey = button.dataset.answerKey;
            const step = currentStep();
            const source = answerKey === "backgroundDetail" ? step.detailOptions : step.options;
            const selected = source.find(([value]) => value === button.dataset.value);
            state.answers[answerKey] = { value: selected[0], points: selected[2] };
            if (answerKey === "background" && selected[0] !== "hobby") {
              delete state.answers.backgroundDetail;
            }
            render();
          });
        });

        const participation = document.getElementById("participation");
        if (participation) {
          participation.addEventListener("change", () => {
            state.answers.participation = participation.checked;
            render();
          });
        }

        ["firstName", "lastName", "phone", "email"].forEach((id) => {
          const input = document.getElementById(id);
          if (!input) return;
          input.addEventListener("input", () => {
            state.contact[id] = input.value;
            state.error = "";
          });
        });

        app.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", async () => {
            const action = button.dataset.action;
            if (action === "next") state.index = Math.min(state.index + 1, steps.length - 1);
            else if (action === "back") state.index = Math.max(state.index - 1, 0);
            else if (action === "submit") {
              await submitLead();
              return;
            }
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });
      }

      function payload() {
        return {
          kunde: { name: "Swing Happens Piano", id: "swing-happens-piano" },
          typ: "challenge",
          contact: state.contact,
          answers: state.answers,
          score: score(),
          routing: routing(),
          tracking: state.tracking,
          submittedAt: new Date().toISOString(),
        };
      }

      async function submitLead() {
        const c = state.contact;
        if (!c.firstName.trim() || !c.lastName.trim() || !c.phone.trim() || !c.email.trim()) {
          state.error = "Please fill in name, phone, and email.";
          render();
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) {
          state.error = "Please enter a valid email.";
          render();
          return;
        }

        const data = payload();
        sessionStorage.setItem("swing-piano-lead", JSON.stringify(data));

        const webhook = window.SWING_PIANO?.webhookUrl;
        if (webhook) {
          try {
            await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
          } catch (err) {
            console.warn("webhook failed", err);
          }
        }

        window.location.href = "oto.html";
      }

      render();
    </script>
  </body>
</html>
